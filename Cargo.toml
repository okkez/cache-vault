[package]
name = "cache-vault"
license = "MIT OR Apache-2.0"
authors = ["okkez <okkez000@gmail.com>"]
description = "Caching secret values to SQLite with encryption"
repository = "https://github.com/okkez/cache-vault"
homepage = "https://github.com/okkez/cache-vault"
version = "0.1.1"
edition = "2021"

[profile.release]
strip = true
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"

[dependencies]
anyhow = "1.0.86"
argon2 = "0.5.3"
base32 = "0.5.0"
chacha20poly1305 = { version = "0.10.1", features = ["std"] }
chrono = { version = "0.4.38", features = ["serde"] }
dirs = "6.0.0"
futures = "0.3.30"
keyring = { version = "3.0.0", features = ["linux-native"] }
sqlx = { version = "0.8.0", features = ["sqlite", "chrono", "runtime-tokio-native-tls"] }
tempfile = "3.12.0"
thiserror = "2.0"
tokio = { version = "1.39.2", features = ["full"] }
tracing = "0.1.0"

[dev-dependencies]
tracing-test = "0.2"

[lib]
name = "cache_vault"

